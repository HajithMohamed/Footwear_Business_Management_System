# Production stack: Caddy terminates TLS, Apache/PHP serves the application,
# and MySQL is reachable only on the private backend network.
#
# Copy .env.example to .env, fill the production placeholders, then run:
# docker compose -f docker-compose.prod.yml up -d --build

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env (for example, example.com)}
      CADDY_EMAIL: ${CADDY_EMAIL:?Set CADDY_EMAIL in .env for TLS certificate notices}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Shoe Bank}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://${APP_DOMAIN:?Set APP_DOMAIN in .env}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Colombo}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      DB_USERNAME: ${MYSQL_USER:?Set MYSQL_USER in .env}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      SESSION_NAME: ${SESSION_NAME:-footwear_erp_session}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TESSERACT_PATH: ${TESSERACT_PATH:-}
      PDFTOPPM_PATH: ${PDFTOPPM_PATH:-}
    volumes:
      - app_storage:/var/www/html/storage
      - uploads:/var/www/html/public/uploads
    expose:
      - "80"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen(\"127.0.0.1\",80); exit($$s ? 0 : 1);'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - backend

volumes:
  mysql_data:
  app_storage:
  uploads:
  caddy_data:
  caddy_config:

networks:
  frontend:
  backend:
    internal: true

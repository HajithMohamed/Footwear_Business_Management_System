<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Uploads are DATA, never code — enforce at the server level regardless of
    # what the folder contains (belt-and-braces with public/uploads/.htaccess).
    <Directory /var/www/html/public/uploads>
        php_admin_flag engine off
        Options -Indexes -ExecCGI
        <FilesMatch "\.(php|phtml|phar|pl|py|cgi|sh)$">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

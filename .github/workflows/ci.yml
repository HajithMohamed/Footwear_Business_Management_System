name: CI

on:
  push:
    branches: [Development, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.3"]
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, gd, pdo_mysql
          coverage: none
      - name: Lint every PHP file
        run: find app bin config database public scripts tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Run the test suite
        run: php tests/run.php
